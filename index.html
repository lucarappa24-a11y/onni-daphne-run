<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Onni & Daphne Run</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7fc1e8">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Onni & Daphne">
<style>
  * {
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #87CEEB;
    height: 100%; width: 100%;
    touch-action: none;
    font-family: -apple-system, system-ui, sans-serif;
  }
  canvas { display: block; touch-action: none; }
  #hud {
    position: fixed; top: 12px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 16px; color: white; font-weight: bold;
    font-size: 22px; text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    pointer-events: none; z-index: 10;
  }
  #invincibleBadge {
    position: fixed; top: 48px; left: 0; right: 0;
    text-align: center; color: #ffd60a; font-weight: bold; font-size: 18px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    pointer-events: none; z-index: 10;
  }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: white; text-align: center; z-index: 20;
  }
  #overlay h1 { font-size: 32px; margin: 0 0 8px; }
  #overlay p { font-size: 18px; margin: 4px 0; opacity: 0.9; }
  #overlay button {
    margin-top: 20px; padding: 14px 32px; font-size: 20px;
    border: none; border-radius: 30px; background: #ffb703;
    color: #333; font-weight: bold; cursor: pointer;
  }
  .hidden { display: none !important; }
  #dogSelect { display: flex; gap: 20px; margin-top: 10px; }
  .dogBtn {
    padding: 10px 18px; border-radius: 16px; border: 3px solid transparent;
    background: #fff; color: #333; font-weight: bold; cursor: pointer; font-size: 16px;
  }
  .dogBtn.selected { border-color: #ffb703; }
  #nameForm, #board { margin-top: 12px; width: min(320px, 90%); }
  #nameForm input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 18px; border-radius: 14px; border: 3px solid #ffb703; text-align: center; }
  #nameForm button { margin-top: 10px; }
  #board ol { text-align: left; margin: 8px 0 0; padding-left: 30px; max-height: 42vh; overflow-y: auto; font-size: 16px; }
  #board li { margin: 2px 0; }
  #board li b { float: right; }
  #board .me { color: #ffd60a; }
  .small { font-size: 15px !important; padding: 8px 20px !important; margin-top: 10px !important; }

  #controls {
    position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 18px; z-index: 15; pointer-events: none;
  }
  .ctrlBtn {
    pointer-events: auto;
    width: 132px; height: 132px; padding: 0;
    border: none; background: transparent;
    touch-action: none; user-select: none; -webkit-user-select: none;
    transition: transform 0.06s ease-out, filter 0.06s ease-out;
  }
  .ctrlBtn img { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
  .ctrlBtn:active, .ctrlBtn.pressed { transform: scale(0.88); filter: brightness(1.15); }
  #fireBtn {
    position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    width: 86px; height: 86px; margin-left: -43px; border-radius: 50%; z-index: 16;
    border: 5px solid #141518;
    background: radial-gradient(circle at 34% 28%, #ffb08a 0%, #ff6a3d 28%, #e0362b 62%, #a81a16 100%);
    box-shadow: 0 6px 0 #141518, 0 10px 14px rgba(0,0,0,0.35), inset 0 -6px 0 rgba(0,0,0,0.18);
    color: #fff; font: 900 17px/1 -apple-system, system-ui, sans-serif; letter-spacing: 0.5px;
    text-shadow: -2px -2px 0 #141518, 2px -2px 0 #141518, -2px 2px 0 #141518, 2px 2px 0 #141518, 0 3px 0 #141518;
    touch-action: none; user-select: none; -webkit-user-select: none;
    animation: firePop 0.25s ease-out, firePulse 0.9s ease-in-out 0.25s infinite;
  }
  #fireBtn.pressed { transform: translateY(5px); box-shadow: 0 1px 0 #141518, 0 4px 8px rgba(0,0,0,0.3), inset 0 -3px 0 rgba(0,0,0,0.18); animation: none; }
  @keyframes firePop { from { transform: scale(0.2); } to { transform: scale(1); } }
  @keyframes firePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @media (prefers-reduced-motion: reduce) { #fireBtn { animation: none; } }
</style>
</head>
<body>
<div id="hud">
  <span id="score">🦴 0</span>
  <span id="best">Record: 0</span>
</div>
<div id="invincibleBadge"></div>

<canvas id="game"></canvas>

<button id="fireBtn" class="hidden" aria-label="Spara">SPARA</button>
<div id="controls">
  <button class="ctrlBtn" id="duckBtn" aria-label="Abbassati"><img src="art/ui/arrow-down.png" alt=""></button>
  <button class="ctrlBtn" id="jumpBtn" aria-label="Salta"><img src="art/ui/arrow-up.png" alt=""></button>
</div>

<div id="overlay">
  <h1 id="title">Onni & Daphne Run</h1>
  <p id="subtitle">Scegli il cane — salta gli ostacoli, abbassati sotto le sbarre, raccogli i premietti!</p>
  <div id="dogSelect">
    <button class="dogBtn selected" data-dog="onni">🐾 Onni</button>
    <button class="dogBtn" data-dog="daphne">🐾 Daphne</button>
  </div>
  <div id="nameForm" class="hidden">
    <p>Sei in classifica! Scrivi il tuo nome:</p>
    <input id="nameInput" maxlength="16" placeholder="Il tuo nome" autocomplete="off">
    <button id="saveScore">Salva punteggio</button>
  </div>
  <div id="board" class="hidden"></div>
  <button id="startBtn">Gioca</button>
  <button id="boardBtn" class="small">Classifica</button>
</div>

<script src="dogrig.js"></script>
<script src="background.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="leaderboard.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, GROUND_Y;

// il canvas lavora alla risoluzione reale dello schermo (sui telefoni 2-3 volte quella "logica"), così niente sgranature
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  GROUND_Y = H * 0.78;
}
window.addEventListener('resize', resize);
resize();

// ---- stato gioco ----
let state = 'menu'; // menu | playing | gameover
let selectedDog = 'onni';
let score = 0;
let best = 0;
try { best = parseInt(localStorage.getItem('onnidaphne_best') || '0', 10); } catch (e) {}
document.getElementById('best').textContent = 'Record: ' + best;

const GRAVITY = 0.0028;
const JUMP_V = -0.95;
const SCROLL_BASE = 0.30;       // px/ms iniziale, più gestibile
const SCROLL_MAX_ADD = 0.42;    // quanto può crescere nel tempo
const RAMP_TIME = 70000;        // ms per avvicinarsi alla velocità massima

let speed = SCROLL_BASE;
// crocchette (super premietto): ogni ostacolo ne regge 3, distrutto con le crocchette vale come 6 ossetti
const FIRE_INTERVAL = 120;    // ms tra un colpo e l'altro tenendo premuto
const KIBBLE_SPEED = 0.85;    // px/ms verso destra
const OBSTACLE_HP = 3;
const SHOT_SCORE = 60;        // 6 ossetti x 10
let kibbles = [], crumbs = [], popups = [];
let firing = false, fireCooldown = 0, fireVisible = false;
let worldX = 0;   // distanza percorsa (px), muove i livelli dello sfondo
let gameTime = 0; // orologio di gioco (ms), usato per difficoltà e invincibilità

const CROUCH_H = 30;

// Onni: piu bassa, piu larga, zampe corte. Daphne: piu alta, snella, zampe lunghe.
const SPR = {
  onni:   { standH: 60, bodyX0: 6, bodyX1: 58, bodyH: 25, legLen: 15, legW: 7,   headR: 14,   headX: 63, neckW: 16 },
  daphne: { standH: 68, bodyX0: 8, bodyX1: 56, bodyH: 18, legLen: 29, legW: 5.5, headR: 12.5, headX: 63, neckW: 11 }
};
function standH() { return SPR[selectedDog].standH; }

const dog = {
  x: 90, y: 0, w: 70, h: 50,
  vy: 0, onGround: true, legPhase: 0, crouching: false
};

function resetDog() {
  dog.crouching = false;
  dog.h = standH();
  dog.y = GROUND_Y - dog.h;
  dog.vy = 0;
  dog.onGround = true;
}

// ostacoli e premietti
let obstacles = [];
let treats = [];
let spawnTimer = 0;
let freeTreatTimer = 0;
let specialTimer = 0;
let pendingSpecial = false;
let highTreats = false;

let invincibleUntil = 0; // in gameTime ms

const AIR_TIME = 2 * -JUMP_V / GRAVITY; // durata di un salto in ms

function addTreat(x, heightAboveGround, special) {
  const toy = special ? TOYS[Math.floor(Math.random() * TOYS.length)] : null;
  treats.push({ x, y: GROUND_Y - heightAboveGround, r: special ? 15 : 12, taken: false, special, toy });
}

const TOYS = ['ciabatta', 'pallina', 'orsetto', 'calzino'];

// ostacolo + premietti sempre raggiungibili senza toccare l'ostacolo
function spawnObstacle() {
  // le sbarre (solo abbassandosi) compaiono dopo i primi secondi e diventano sempre più frequenti
  const ramp = Math.min(gameTime / RAMP_TIME, 1);
  const barChance = ramp < 0.12 ? 0 : Math.min(0.45, ramp * 0.55);
  const x0 = W + 20;
  // gatti (dopo ~10 s) e piccioni (dopo ~17 s): si muovono verso il cane, quindi partono più lontano
  // in modo da arrivare al cane nello stesso istante di un ostacolo fermo (la distanza dagli altri resta saltabile)
  const r = Math.random();
  const animal = ramp > 0.15 && r < 0.17 ? 'cat' : ramp > 0.25 && r < 0.3 ? 'bird' : null;
  if (animal) {
    const vx = animal === 'cat' ? 0.1 + Math.random() * 0.06 : 0.07 + Math.random() * 0.05;
    const arrive = (x0 - dog.x) / speed;
    const xStart = dog.x + arrive * (speed + vx);
    if (animal === 'cat') obstacles.push({ kind: 'cat', x: xStart, y: GROUND_Y - 30, w: 40, h: 30, vx, v: Math.random() });
    else obstacles.push({ kind: 'bird', x: xStart, y: GROUND_Y - (CROUCH_H + 20) - 22, w: 34, h: 22, vx, v: Math.random() });
    return;
  }
  const kind = Math.random() < barChance ? 'bar' : 'ground';
  if (kind === 'ground') {
    const h = 34 + Math.random() * 28;
    obstacles.push({ kind, x: x0, y: GROUND_Y - h, w: 28, h, v: Math.random() });
    if (Math.random() < 0.6) {
      // arco alto sopra l'ostacolo: si prende solo saltando, sempre sopra l'ostacolo
      const cx = x0 + 14;
      addTreat(cx - 45, 135, false);
      addTreat(cx, 150, false);
      addTreat(cx + 45, 135, false);
    }
  } else {
    // la sbarra parte dal cielo: non si può scavalcare saltando, si passa solo abbassati
    // metà a caso: sbarra dal cielo (solo abbassandosi) o sbarra sospesa bassa (si salta o ci si passa sotto)
    const gap = CROUCH_H + 20;
    if (Math.random() < 0.5) {
      obstacles.push({ kind, x: x0, y: -50, w: 44, h: GROUND_Y - gap + 50, v: Math.random() });
    } else {
      obstacles.push({ kind, x: x0, y: GROUND_Y - gap - 50, w: 44, h: 50, v: Math.random() });
    }
    if (Math.random() < 0.6) {
      // premietti a terra sotto la sbarra: si prendono solo abbassandosi
      const cx = x0 + 22;
      addTreat(cx - 40, 14, false);
      addTreat(cx, 14, false);
      addTreat(cx + 40, 14, false);
    }
  }
}

// premietti liberi a metà tra due ostacoli: a terra (facili) o a mezz'aria (difficili, richiedono un salto perfetto)
function spawnFreeTreats(high) {
  const x0 = W + 20;
  if (high) {
    addTreat(x0, 105, false);
    addTreat(x0 + 32, 125, false);
    addTreat(x0 + 64, 105, false);
    return;
  }
  const n = 3 + Math.floor(Math.random() * 2);
  const withSpecial = pendingSpecial;
  pendingSpecial = false;
  for (let i = 0; i < n; i++) {
    const isStar = withSpecial && i === Math.floor(n / 2);
    addTreat(x0 + i * 30, 24, isStar);
  }
}

function resetGame() {
  score = 0;
  speed = SCROLL_BASE;
  gameTime = 0;
  invincibleUntil = 0;
  obstacles = [];
  treats = [];
  kibbles = []; crumbs = []; popups = [];
  firing = false; fireCooldown = 0; setFireVisible(false);
  spawnTimer = 1200;
  freeTreatTimer = 0;
  pendingSpecial = false;
  specialTimer = 18000 + Math.random() * 7000;
  resetDog();
}

// ---- disegno ----
function drawBackground() {
  Foligno.draw(ctx, W, H, GROUND_Y, worldX);
}

// disegni SVG provvisori: groundY = y dei piedi nel sistema del viewBox (già traslato), w = larghezza viewBox
const DOG_IMG = {
  onni:   { src: 'art/onni.svg',   w: 330, h: 227, groundY: 212, splitY: 150, bodyCx: 150 },
  daphne: { src: 'art/daphne.svg', w: 330, h: 255, groundY: 240, splitY: 165, bodyCx: 155 }
};
for (const k in DOG_IMG) { const im = new Image(); im.src = DOG_IMG[k].src; DOG_IMG[k].img = im; }
const DOG_SCALE = 0.33;

// cani ricavati dalle foto vere (scontornati + filtro realistico), animati a ritagli
const PHOTO_RIGS = {
  onni: {
    scale: 0.32,
    rig: {
      width: 360, height: 228, groundY: 222, centerX: 180,
      legs: [
        { name: 'hind', x: 49, y: 115, w: 72, h: 113, pivot: [84, 135], cut: 141 },
        { name: 'front', x: 224, y: 124, w: 58, h: 104, pivot: [251, 143], cut: 150 }
      ]
    }
  },
  // Daphne: da Foto/Nuove/IMG_7398, vita assottigliata e zampette ridisegnate (un po' più alta di Onni, ma più snella)
  daphne: {
    scale: 0.4,
    rig: {
      width: 360, height: 201, groundY: 191, centerX: 180,
      legs: [
        { name: 'hind', x: 49, y: 77, w: 84, h: 124, pivot: [98, 97], cut: 103, stretch: 1 },
        { name: 'front', x: 234, y: 96, w: 43, h: 105, pivot: [254, 114], cut: 120, stretch: 1 }
      ]
    }
  }
};
for (const k in PHOTO_RIGS) DogRig.load(`${k}_light`, `art/foto/${k}_light`, PHOTO_RIGS[k].rig);

function drawDog() {
  const d = DOG_IMG[selectedDog];
  const s = DOG_SCALE;
  const feetX = dog.x + dog.w / 2, feetY = dog.y + dog.h;
  const invincible = gameTime < invincibleUntil;
  const crouch = dog.crouching && dog.onGround;

  ctx.save();
  ctx.translate(feetX, feetY);
  if (invincible) {
    ctx.save();
    ctx.globalAlpha = 0.3 + 0.3 * (0.5 + 0.5 * Math.sin(gameTime * 0.012));
    ctx.fillStyle = '#ffd60a';
    ctx.beginPath(); ctx.ellipse(10, -32, 62, 42, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  const photo = PHOTO_RIGS[selectedDog];
  if (photo) {
    const pose = crouch ? { crouch: true } : !dog.onGround ? { air: dog.vy < 0 ? -1 : 1 } : { run: state === 'playing' ? dog.legPhase : null };
    if (DogRig.draw(ctx, `${selectedDog}_light`, pose, photo.scale)) { ctx.restore(); return; }
  }
  const ready = d.img.complete && d.img.naturalWidth;
  if (crouch && ready) {
    // abbassata: zampe piegate (solo la parte delle zampe si accorcia), corpo intero e testa un po' in giù
    const kx = d.img.naturalWidth / d.w, ky = d.img.naturalHeight / d.h;
    const legsH = (d.groundY - d.splitY) * s * 0.3;
    ctx.drawImage(d.img, 0, d.splitY * ky, d.w * kx, (d.groundY - d.splitY) * ky,
      -d.bodyCx * s, -legsH, d.w * s, legsH);
    ctx.translate(0, -legsH + 2);
    ctx.rotate(0.12);
    ctx.scale(0.88, 0.88);
    ctx.drawImage(d.img, 0, 0, d.w * kx, d.splitY * ky, -d.bodyCx * s, -d.splitY * s, d.w * s, d.splitY * s);
    ctx.restore();
    return;
  }
  if (!dog.onGround) {
    ctx.rotate(dog.vy < 0 ? -0.15 : 0.1);
  } else {
    ctx.translate(0, -Math.abs(Math.sin(dog.legPhase)) * 3);
    ctx.rotate(Math.sin(dog.legPhase) * 0.04);
  }
  if (ready) {
    ctx.drawImage(d.img, -d.bodyCx * s, -d.groundY * s, d.w * s, d.h * s);
  }
  ctx.restore();
}

function drawObstacles() {
  for (const o of obstacles) {
    const v = o.v ?? 0; // variante scelta a caso quando l'ostacolo compare
    ctx.save();
    if (o.hitAt != null && gameTime - o.hitAt < 120) ctx.translate((Math.random() - 0.5) * 5, (Math.random() - 0.5) * 3);
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#3a2c25'; ctx.lineWidth = 2;
    if (o.kind === 'cat') {
      drawCat(o);
    } else if (o.kind === 'bird') {
      drawPigeon(o);
    } else if (o.kind === 'ground') {
      if (v < 0.62) drawGeraniumPot(o); else drawBollard(o);
    } else if (o.y < 0) {
      drawQuintanaBanner(o, v);
    } else {
      drawHangingSign(o);
    }
    ctx.restore();
  }
}

// gatto randagio che corre verso il cane (guarda a sinistra)
const CAT_COATS = [
  { body: '#e39445', dark: '#b8662a', belly: '#f6dcb8' },   // rosso tigrato
  { body: '#2b2a2e', dark: '#141317', belly: '#4a474f' },   // nero
  { body: '#9a9894', dark: '#6b6965', belly: '#e9e6df' }    // grigio tigrato
];
function drawCat(o) {
  const coat = CAT_COATS[Math.floor(o.v * CAT_COATS.length)];
  const t = gameTime * 0.03 + o.v * 10;
  const bob = Math.abs(Math.sin(t)) * 2;
  const x = o.x, base = o.y + o.h, bodyY = base - 17 - bob;
  ctx.lineWidth = 2; ctx.strokeStyle = '#3a2c25';
  // coda alzata e mossa
  ctx.strokeStyle = '#3a2c25'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  const tailPath = () => { ctx.beginPath(); ctx.moveTo(x + 34, bodyY - 2); ctx.quadraticCurveTo(x + 48, bodyY - 6, x + 46 + Math.sin(t) * 3, bodyY - 20); };
  tailPath(); ctx.stroke();
  ctx.strokeStyle = coat.body; ctx.lineWidth = 3.5; tailPath(); ctx.stroke();
  // zampe in corsa
  const legs = [[8, Math.sin(t)], [14, Math.sin(t + Math.PI)], [28, Math.sin(t + Math.PI)], [34, Math.sin(t)]];
  for (const [lx, ph] of legs) {
    ctx.strokeStyle = '#3a2c25'; ctx.lineWidth = 5.5;
    ctx.beginPath(); ctx.moveTo(x + lx, bodyY + 4); ctx.lineTo(x + lx + ph * 6, base - 1); ctx.stroke();
    ctx.strokeStyle = coat.body; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x + lx, bodyY + 4); ctx.lineTo(x + lx + ph * 6, base - 1); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  // corpo
  ctx.fillStyle = coat.body; ctx.strokeStyle = '#3a2c25'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x + 22, bodyY, 16, 8.5, 0.05, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = coat.belly; ctx.beginPath(); ctx.ellipse(x + 20, bodyY + 4.5, 10, 3.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = coat.dark; ctx.lineWidth = 2;
  for (const sx of [18, 24, 30]) { ctx.beginPath(); ctx.moveTo(x + sx, bodyY - 8); ctx.lineTo(x + sx - 2, bodyY - 2); ctx.stroke(); }
  // testa con orecchie
  const hx = x + 6, hy = bodyY - 7;
  ctx.fillStyle = coat.body; ctx.strokeStyle = '#3a2c25'; ctx.lineWidth = 2;
  for (const ex of [-5, 3]) { ctx.beginPath(); ctx.moveTo(hx + ex - 2, hy - 4); ctx.lineTo(hx + ex + 1, hy - 12); ctx.lineTo(hx + ex + 5, hy - 4); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  ctx.beginPath(); ctx.ellipse(hx, hy, 8.5, 7.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = coat.belly; ctx.beginPath(); ctx.ellipse(hx - 3, hy + 3, 4.5, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#9bd04a'; ctx.beginPath(); ctx.ellipse(hx - 3, hy - 1.5, 2, 2.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.fillRect(hx - 3.4, hy - 3.4, 0.9, 3.8);
  ctx.fillStyle = '#e88a9a'; ctx.beginPath(); ctx.arc(hx - 7, hy + 1.5, 1.4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 0.8;

}

// stendardo della Quintana che scende dall'alto: si passa solo abbassandosi
function drawQuintanaBanner(o, v) {

  ctx.beginPath(); ctx.moveTo(o.x, bottom - tip); ctx.lineTo(o.x + o.w / 2, bottom); ctx.lineTo(o.x + o.w / 2, bottom - tip); ctx.closePath(); ctx.fill();
  ctx.fillStyle = b;
  ctx.beginPath(); ctx.moveTo(o.x + o.w / 2, bottom - tip); ctx.lineTo(o.x + o.w / 2, bottom); ctx.lineTo(o.x + o.w, bottom - tip); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x, bottom - tip); ctx.lineTo(o.x + o.w / 2, bottom); ctx.lineTo(o.x + o.w, bottom - tip); ctx.lineTo(o.x + o.w, o.y); ctx.stroke();

function drawTreats() {
  treats.forEach(t => {
    if (t.taken) return;
    ctx.save();
    ctx.translate(t.x, t.y);
    if (t.special) {
      // alone luminoso: segnala che dà invincibilità
      ctx.globalAlpha = 0.35 + 0.2 * Math.sin(gameTime * 0.01);
      ctx.fillStyle = '#ffd60a';
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      drawToy(t.toy);
    } else {
      drawBone();
    }
    ctx.restore();
  });
}

function drawBone() {
  ctx.fillStyle = '#fff6e0';
  ctx.strokeStyle = '#5b4a33';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.rect(-8, -3.5, 16, 7);
  for (const [x, y] of [[-9, -4], [-9, 4], [9, -4], [9, 4]]) {
    ctx.moveTo(x + 4.5, y);
    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
  }
  ctx.stroke();
  ctx.fill();
}

function drawToy(toy) {
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#222';
  if (toy === 'pallina') {
    ctx.fillStyle = '#c6e83a';
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-12, 0, 10, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(12, 0, 10, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  } else if (toy === 'orsetto') {
    ctx.fillStyle = '#b5824f';
    for (const [x, y, r] of [[-8, -10, 5], [8, -10, 5], [0, 0, 12]]) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#e8c9a0';
    ctx.beginPath(); ctx.ellipse(0, 4, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222';
    for (const [x, y, r] of [[-4, -3, 1.6], [4, -3, 1.6], [0, 2.5, 1.8]]) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  } else if (toy === 'calzino') {
    ctx.fillStyle = '#e85d75';
    ctx.beginPath();
    ctx.moveTo(-6, -14); ctx.lineTo(5, -14); ctx.lineTo(5, 4);
    ctx.quadraticCurveTo(14, 4, 14, 10); ctx.quadraticCurveTo(14, 15, 6, 15);
    ctx.lineTo(-2, 15); ctx.quadraticCurveTo(-6, 15, -6, 10); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-5, -13, 9, 3); ctx.fillRect(-5, -7, 9, 3);
  } else {
    // ciabatta
    ctx.fillStyle = '#4aa3df';
    ctx.beginPath(); ctx.ellipse(0, 3, 15, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f2f2f2';
    ctx.beginPath(); ctx.ellipse(4, 0, 8, 6, 0, Math.PI, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

// ---- loop ----
let lastTime = null;
function loop(t) {
  if (lastTime === null) lastTime = t;
  const dt = Math.min(t - lastTime, 40);
  lastTime = t;

  if (state === 'menu') worldX += dt * 0.05;
  drawBackground();

  if (state === 'playing') {
    update(dt);
  }

  if (state !== 'playing') updateEffects(dt);
  drawObstacles();
  drawTreats();
  drawDog();
  drawKibbles();

  requestAnimationFrame(loop);
}

function update(dt) {
  gameTime += dt;
  worldX += speed * dt;
  const ramp = Math.min(gameTime / RAMP_TIME, 1);
  speed = SCROLL_BASE + ramp * SCROLL_MAX_ADD;

  const invincible = gameTime < invincibleUntil;
  document.getElementById('invincibleBadge').textContent = invincible
    ? '✨ Invincibile! ' + Math.ceil((invincibleUntil - gameTime) / 1000) + 's'
    : '';

  // tasto SPARA: c'è solo finché dura il super premietto
  setFireVisible(invincible);
  if (!invincible) firing = false;
  fireCooldown -= dt;
  if (firing && fireCooldown <= 0) shootKibble();

  // altezza cane in base a crouch
  const targetH = dog.crouching && dog.onGround ? CROUCH_H : standH();
  if (dog.h !== targetH) {
    const bottom = dog.y + dog.h;
    dog.h = targetH;
    dog.y = bottom - dog.h;
  }

  // fisica salto
  if (!dog.onGround) {
    dog.vy += GRAVITY * dt;
    dog.y += dog.vy * dt;
    if (dog.y >= GROUND_Y - dog.h) {
      dog.y = GROUND_Y - dog.h;
      dog.vy = 0;
      dog.onGround = true;
    }
  } else {
    dog.legPhase += dt * 0.02;
  }

  // spawn ostacoli (sempre più frequenti col tempo)
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnObstacle();
    // distanza minima in px = lunghezza di un salto + margine, così ogni ostacolo è sempre superabile
    const extraPx = Math.random() * 180 + (1 - ramp) * 150;
    // 25%: spazio più lungo con premietti in alto, raggiungibili solo con un salto ben cronometrato
    highTreats = Math.random() < 0.25;
    const gapMs = AIR_TIME * 1.1 + extraPx / speed + (highTreats ? AIR_TIME * 1.2 : 0);
    spawnTimer = gapMs;
    freeTreatTimer = gapMs * 0.5;
  }
  if (freeTreatTimer > 0) {
    freeTreatTimer -= dt;
    if (freeTreatTimer <= 0 && (highTreats || Math.random() < 0.7)) spawnFreeTreats(highTreats);
  }
  specialTimer -= dt;
  if (specialTimer <= 0) {
    pendingSpecial = true;
    specialTimer = 22000 + Math.random() * 10000;
  }

  obstacles.forEach(o => o.x -= (speed + (o.vx || 0)) * dt);
  obstacles = obstacles.filter(o => o.x + o.w > -10);

  treats.forEach(t => t.x -= speed * dt);
  treats = treats.filter(t => t.x > -20 && !t.taken);

  // collisioni ostacoli
  const dogBox = { x: dog.x + 10, y: dog.y + 6, w: dog.w - 20, h: dog.h - 8 };
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    if (rectsOverlap(dogBox, o)) {
      if (invincible) {
        // travolto con l'aura gialla: sparisce ma non dà punti
        burst(o.x + o.w / 2, Math.max(o.y + o.h / 2, GROUND_Y - 120), '#ffd60a', 8);
        obstacles.splice(i, 1);
      } else {
        gameOver();
        return;
      }
    }
  }

  updateKibbles(dt);

  // raccolta premietti
  for (const t of treats) {
    const dx = (dog.x + dog.w / 2) - t.x;
    const dy = (dog.y + dog.h / 2) - t.y;
    if (Math.sqrt(dx * dx + dy * dy) < 34) {
      t.taken = true;
      if (t.special) {
        invincibleUntil = gameTime + 10000;
        score += 50;
      } else {
        score += 10;
      }
    }
  }

  score += dt * 0.012;
  document.getElementById('score').textContent = '🦴 ' + Math.floor(score);
}

// ---- crocchette ----
const fireBtn = document.getElementById('fireBtn');
function setFireVisible(v) {
  if (v === fireVisible) return;
  fireVisible = v;
  fireBtn.classList.toggle('hidden', !v);
  if (!v) fireBtn.classList.remove('pressed');
}

function mouthPos() {
  // punta del muso: davanti al box del cane, all'altezza della bocca (più bassa se abbassato)
  const ahead = selectedDog === 'daphne' ? 66 : 52;
  return { x: dog.x + dog.w / 2 + ahead, y: dog.y + (dog.crouching && dog.onGround ? 10 : 8) };
}

function shootKibble() {
  if (state !== 'playing' || gameTime >= invincibleUntil || fireCooldown > 0) return;
  fireCooldown = FIRE_INTERVAL;
  const m = mouthPos();
  // mira leggera verso l'ostacolo più vicino davanti (così si colpiscono anche gatti e vasi bassi)
  let target = null;
  for (const o of obstacles) if (o.x + o.w > m.x && o.x < W && (!target || o.x < target.x)) target = o;
  let vy = 0;
  if (target) {
    const ty = target.y < 0 ? target.y + target.h - 16 : target.y + target.h / 2;
    const t = Math.max(80, (target.x + target.w / 2 - m.x) / (KIBBLE_SPEED + speed + (target.vx || 0)));
    vy = Math.max(-0.35, Math.min(0.35, (ty - m.y) / t));
  }
  kibbles.push({ x: m.x, y: m.y + (Math.random() - 0.5) * 3, vy, rot: Math.random() * 6 });
  crumbs.push({ x: m.x + 2, y: m.y, vx: 0.05, vy: -0.03, life: 120, max: 120, size: 7, color: 'rgba(255,240,200,0.9)', flash: true });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 0.08 + Math.random() * 0.22;
    crumbs.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.1, life: 450, max: 450, size: 2 + Math.random() * 3, color });
  }
}

function updateKibbles(dt) {
  for (const k of kibbles) {
    k.x += KIBBLE_SPEED * dt; k.y += k.vy * dt; k.rot += dt * 0.02;
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      const cx = Math.max(o.x, Math.min(k.x, o.x + o.w)), cy = Math.max(o.y, Math.min(k.y, o.y + o.h));
      if ((k.x - cx) ** 2 + (k.y - cy) ** 2 > 36) continue;
      k.dead = true;
      o.hp = (o.hp ?? OBSTACLE_HP) - 1;
      o.hitAt = gameTime;
      burst(k.x, k.y, '#a0602c', 4);
      if (o.hp <= 0) {
        const py = Math.max(o.y + o.h / 2, GROUND_Y - 130);
        burst(o.x + o.w / 2, py, '#a0602c', 10);
        burst(o.x + o.w / 2, py, '#ffd60a', 8);
        popups.push({ x: o.x + o.w / 2, y: py - 10, text: '+' + SHOT_SCORE, life: 900, max: 900 });
        score += SHOT_SCORE;
        obstacles.splice(i, 1);
      }
      break;
    }
  }
  kibbles = kibbles.filter(k => !k.dead && k.x < W + 20 && k.y > -20 && k.y < H);
  updateEffects(dt);
}

function updateEffects(dt) {
  for (const c of crumbs) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 0.0009 * dt; c.life -= dt; }
  crumbs = crumbs.filter(c => c.life > 0);
  for (const p of popups) { p.y -= 0.04 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
}

function drawKibbles() {
  for (const k of kibbles) {
    ctx.save();
    ctx.translate(k.x, k.y); ctx.rotate(k.rot);
    const g = ctx.createRadialGradient(-2, -2, 1, 0, 0, 6.5);
    g.addColorStop(0, '#d39a5a'); g.addColorStop(0.6, '#a0602c'); g.addColorStop(1, '#6e3d18');
    ctx.fillStyle = g; ctx.strokeStyle = '#3a2c25'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(70,35,12,0.65)';
    for (const [dx, dy] of [[-1.8, 1.2], [1.6, -0.6], [0.4, 2.2]]) { ctx.beginPath(); ctx.arc(dx, dy, 0.8, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,240,215,0.7)'; ctx.beginPath(); ctx.arc(-2, -2.2, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  for (const c of crumbs) {
    ctx.globalAlpha = Math.max(0, c.life / c.max);
    ctx.fillStyle = c.color;
    if (c.flash) { ctx.beginPath(); ctx.arc(c.x, c.y, c.size * (c.life / c.max), 0, Math.PI * 2); ctx.fill(); }
    else ctx.fillRect(c.x - c.size / 2, c.y - c.size / 2, c.size, c.size);
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life / 300);
    ctx.font = '900 20px -apple-system, system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = '#141518'; ctx.lineJoin = 'round';
    ctx.strokeText(p.text, p.x, p.y); ctx.fillStyle = '#ffd60a'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function jump() {
  if (state !== 'playing') return;
  if (dog.onGround && !dog.crouching) {
    dog.vy = JUMP_V;
    dog.onGround = false;
  }
}

function setCrouch(v) {
  if (state !== 'playing') return;
  dog.crouching = v;
}

function gameOver() {
  state = 'gameover';
  firing = false; setFireVisible(false);
  const finalScore = Math.floor(score);
  if (finalScore > best) {
    best = finalScore;
    try { localStorage.setItem('onnidaphne_best', String(best)); } catch (e) {}
  }
  document.getElementById('best').textContent = 'Record: ' + best;
  document.getElementById('invincibleBadge').textContent = '';
  document.getElementById('title').textContent = 'Ops! 🐾';
  document.getElementById('subtitle').textContent =
    'Punteggio: ' + finalScore + '  —  Record: ' + best;
  document.getElementById('startBtn').textContent = 'Riprova';
  document.getElementById('overlay').classList.remove('hidden');
  hideBoardUi();
  Leaderboard.qualifies(finalScore).then(q => {
    if (q && state === 'gameover') showNameForm(finalScore);
    else if (state === 'gameover') showBoard(finalScore);
  }).catch(() => {});
}

function hideBoardUi() {
  document.getElementById('nameForm').classList.add('hidden');
  document.getElementById('board').classList.add('hidden');
}

function showNameForm(score) {
  const input = document.getElementById('nameInput');
  const btn = document.getElementById('saveScore');
  input.value = '';
  btn.disabled = false;
  btn.textContent = 'Salva punteggio';
  document.getElementById('nameForm').classList.remove('hidden');
  btn.onclick = async () => {
    btn.disabled = true;
    btn.textContent = 'Salvataggio...';
    try {
      await Leaderboard.submit(input.value, score);
      document.getElementById('nameForm').classList.add('hidden');
      showBoard(score);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Riprova a salvare';
    }
  };
}

async function showBoard(myScore) {
  const box = document.getElementById('board');
  box.classList.remove('hidden');
  box.innerHTML = '<p>Caricamento classifica...</p>';
  if (!Leaderboard.enabled) { box.innerHTML = '<p>Classifica online non ancora attiva.</p>'; return; }
  try {
    const list = await Leaderboard.top();
    if (!list.length) { box.innerHTML = '<p>Nessun punteggio ancora. Sii il primo!</p>'; return; }
    const ol = document.createElement('ol');
    list.forEach(e => {
      const li = document.createElement('li');
      const mine = myScore != null && e.score === Math.floor(myScore) && li && !ol.dataset.marked;
      if (mine) { li.classList.add('me'); ol.dataset.marked = '1'; }
      const name = document.createElement('span'); name.textContent = e.name;
      const score = document.createElement('b'); score.textContent = e.score;
      li.append(name, score);
      ol.appendChild(li);
    });
    box.innerHTML = '<p><b>Primi 20</b></p>';
    box.appendChild(ol);
  } catch (e) {
    box.innerHTML = '<p>Classifica non disponibile (controlla la connessione).</p>';
  }
}

function startGame() {
  hideBoardUi();
  resetGame();
  state = 'playing';
  document.getElementById('overlay').classList.add('hidden');
}

// ---- input ----
document.addEventListener('selectstart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });

const jumpBtn = document.getElementById('jumpBtn');
const duckBtn = document.getElementById('duckBtn');
jumpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); jump(); });
duckBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); duckBtn.classList.add('pressed'); setCrouch(true); });
const releaseDuck = () => { duckBtn.classList.remove('pressed'); setCrouch(false); };
duckBtn.addEventListener('pointerup', releaseDuck);
duckBtn.addEventListener('pointerleave', releaseDuck);
duckBtn.addEventListener('pointercancel', releaseDuck);

const startFire = (e) => {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  fireBtn.classList.add('pressed');
  firing = true;
  shootKibble();
};
const stopFire = () => { fireBtn.classList.remove('pressed'); firing = false; };
fireBtn.addEventListener('pointerdown', startFire);
fireBtn.addEventListener('pointerup', stopFire);
fireBtn.addEventListener('pointerleave', stopFire);
fireBtn.addEventListener('pointercancel', stopFire);

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.code === 'KeyX' && !e.repeat) startFire();
  if (e.code === 'Space' || e.code === 'ArrowUp') jump();
  if (e.code === 'ArrowDown') setCrouch(true);
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'KeyX') stopFire();
  if (e.code === 'ArrowDown') setCrouch(false);
});

document.querySelectorAll('#dogSelect .dogBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#dogSelect .dogBtn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedDog = btn.dataset.dog;
    resetDog();
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('boardBtn').addEventListener('click', () => {
  document.getElementById('subtitle').textContent = 'I migliori punteggi di tutti i giocatori';
  showBoard(null);
});

resetDog();
requestAnimationFrame(loop);

// gioco disponibile offline: attivo solo nella versione pubblicata (tools/build.js mette true)
const OFFLINE_ENABLED = true;
if (OFFLINE_ENABLED && 'serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
