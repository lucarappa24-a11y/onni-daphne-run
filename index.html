<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Onni & Daphne Run</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7fc1e8">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Onni & Daphne">
<style>
  * {
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #87CEEB;
    height: 100%; width: 100%;
    touch-action: none;
    font-family: -apple-system, system-ui, sans-serif;
  }
  canvas { display: block; touch-action: none; }
  #hud {
    position: fixed; top: 12px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 16px; color: white; font-weight: bold;
    font-size: 22px; text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    pointer-events: none; z-index: 10;
  }
  #invincibleBadge {
    position: fixed; top: 48px; left: 0; right: 0;
    text-align: center; color: #ffd60a; font-weight: bold; font-size: 18px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    pointer-events: none; z-index: 10;
  }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: white; text-align: center; z-index: 20;
  }
  #overlay h1 { font-size: 32px; margin: 0 0 8px; }
  #overlay p { font-size: 18px; margin: 4px 0; opacity: 0.9; }
  #overlay button {
    margin-top: 20px; padding: 14px 32px; font-size: 20px;
    border: none; border-radius: 30px; background: #ffb703;
    color: #333; font-weight: bold; cursor: pointer;
  }
  .hidden { display: none !important; }
  #dogSelect, #styleSelect { display: flex; gap: 20px; margin-top: 10px; }
  #styleSelect { gap: 10px; }
  #styleSelect .dogBtn { padding: 6px 14px; font-size: 14px; }
  .dogBtn {
    padding: 10px 18px; border-radius: 16px; border: 3px solid transparent;
    background: #fff; color: #333; font-weight: bold; cursor: pointer; font-size: 16px;
  }
  .dogBtn.selected { border-color: #ffb703; }

  #controls {
    position: fixed; bottom: 24px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 24px; z-index: 15; pointer-events: none;
  }
  .ctrlBtn {
    pointer-events: auto;
    width: 92px; height: 92px; border-radius: 50%;
    border: none; background: rgba(255,255,255,0.85);
    font-size: 15px; font-weight: bold; color: #333;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    user-select: none; -webkit-user-select: none;
  }
  .ctrlBtn:active { background: #ffb703; }
</style>
</head>
<body>
<div id="hud">
  <span id="score">🦴 0</span>
  <span id="best">Record: 0</span>
</div>
<div id="invincibleBadge"></div>

<canvas id="game"></canvas>

<div id="controls">
  <button class="ctrlBtn" id="duckBtn">⬇️<br>Abbassati</button>
  <button class="ctrlBtn" id="jumpBtn">⬆️<br>Salta</button>
</div>

<div id="overlay">
  <h1 id="title">Onni & Daphne Run</h1>
  <p id="subtitle">Scegli il cane — salta gli ostacoli, abbassati sotto le sbarre, raccogli i premietti!</p>
  <div id="dogSelect">
    <button class="dogBtn selected" data-dog="onni">🐾 Onni</button>
    <button class="dogBtn" data-dog="daphne">🐾 Daphne</button>
  </div>
  <div id="styleSelect">
    <button class="dogBtn selected" data-style="light">Realistico</button>
    <button class="dogBtn" data-style="toon">Cartoon</button>
  </div>
  <button id="startBtn">Gioca</button>
</div>

<script src="dogrig.js"></script>
<script src="background.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, GROUND_Y;

// il canvas lavora alla risoluzione reale dello schermo (sui telefoni 2-3 volte quella "logica"), così niente sgranature
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  GROUND_Y = H * 0.78;
}
window.addEventListener('resize', resize);
resize();

// ---- stato gioco ----
let state = 'menu'; // menu | playing | gameover
let selectedDog = 'onni';
let score = 0;
let best = 0;
try { best = parseInt(localStorage.getItem('onnidaphne_best') || '0', 10); } catch (e) {}
document.getElementById('best').textContent = 'Record: ' + best;

const GRAVITY = 0.0028;
const JUMP_V = -0.95;
const SCROLL_BASE = 0.30;       // px/ms iniziale, più gestibile
const SCROLL_MAX_ADD = 0.42;    // quanto può crescere nel tempo
const RAMP_TIME = 70000;        // ms per avvicinarsi alla velocità massima

let speed = SCROLL_BASE;
let worldX = 0;   // distanza percorsa (px), muove i livelli dello sfondo
let gameTime = 0; // orologio di gioco (ms), usato per difficoltà e invincibilità

const CROUCH_H = 30;

// Onni: piu bassa, piu larga, zampe corte. Daphne: piu alta, snella, zampe lunghe.
const SPR = {
  onni:   { standH: 60, bodyX0: 6, bodyX1: 58, bodyH: 25, legLen: 15, legW: 7,   headR: 14,   headX: 63, neckW: 16 },
  daphne: { standH: 68, bodyX0: 8, bodyX1: 56, bodyH: 18, legLen: 29, legW: 5.5, headR: 12.5, headX: 63, neckW: 11 }
};
function standH() { return SPR[selectedDog].standH; }

const dog = {
  x: 90, y: 0, w: 70, h: 50,
  vy: 0, onGround: true, legPhase: 0, crouching: false
};

function resetDog() {
  dog.crouching = false;
  dog.h = standH();
  dog.y = GROUND_Y - dog.h;
  dog.vy = 0;
  dog.onGround = true;
}

// ostacoli e premietti
let obstacles = [];
let treats = [];
let spawnTimer = 0;
let freeTreatTimer = 0;
let specialTimer = 0;
let pendingSpecial = false;
let highTreats = false;

let invincibleUntil = 0; // in gameTime ms

const AIR_TIME = 2 * -JUMP_V / GRAVITY; // durata di un salto in ms

function addTreat(x, heightAboveGround, special) {
  const toy = special ? TOYS[Math.floor(Math.random() * TOYS.length)] : null;
  treats.push({ x, y: GROUND_Y - heightAboveGround, r: special ? 15 : 12, taken: false, special, toy });
}

const TOYS = ['ciabatta', 'pallina', 'orsetto', 'calzino'];

// ostacolo + premietti sempre raggiungibili senza toccare l'ostacolo
function spawnObstacle() {
  // le sbarre (solo abbassandosi) compaiono dopo i primi secondi e diventano sempre più frequenti
  const ramp = Math.min(gameTime / RAMP_TIME, 1);
  const barChance = ramp < 0.12 ? 0 : Math.min(0.45, ramp * 0.55);
  const kind = Math.random() < barChance ? 'bar' : 'ground';
  const x0 = W + 20;
  if (kind === 'ground') {
    const h = 34 + Math.random() * 28;
    obstacles.push({ kind, x: x0, y: GROUND_Y - h, w: 28, h });
    if (Math.random() < 0.6) {
      // arco alto sopra l'ostacolo: si prende solo saltando, sempre sopra l'ostacolo
      const cx = x0 + 14;
      addTreat(cx - 45, 135, false);
      addTreat(cx, 150, false);
      addTreat(cx + 45, 135, false);
    }
  } else {
    // la sbarra parte dal cielo: non si può scavalcare saltando, si passa solo abbassati
    // metà a caso: sbarra dal cielo (solo abbassandosi) o sbarra sospesa bassa (si salta o ci si passa sotto)
    const gap = CROUCH_H + 20;
    if (Math.random() < 0.5) {
      obstacles.push({ kind, x: x0, y: -50, w: 44, h: GROUND_Y - gap + 50 });
    } else {
      obstacles.push({ kind, x: x0, y: GROUND_Y - gap - 50, w: 44, h: 50 });
    }
    if (Math.random() < 0.6) {
      // premietti a terra sotto la sbarra: si prendono solo abbassandosi
      const cx = x0 + 22;
      addTreat(cx - 40, 14, false);
      addTreat(cx, 14, false);
      addTreat(cx + 40, 14, false);
    }
  }
}

// premietti liberi a metà tra due ostacoli: a terra (facili) o a mezz'aria (difficili, richiedono un salto perfetto)
function spawnFreeTreats(high) {
  const x0 = W + 20;
  if (high) {
    addTreat(x0, 105, false);
    addTreat(x0 + 32, 125, false);
    addTreat(x0 + 64, 105, false);
    return;
  }
  const n = 3 + Math.floor(Math.random() * 2);
  const withSpecial = pendingSpecial;
  pendingSpecial = false;
  for (let i = 0; i < n; i++) {
    const isStar = withSpecial && i === Math.floor(n / 2);
    addTreat(x0 + i * 30, 24, isStar);
  }
}

function resetGame() {
  score = 0;
  speed = SCROLL_BASE;
  gameTime = 0;
  invincibleUntil = 0;
  obstacles = [];
  treats = [];
  spawnTimer = 1200;
  freeTreatTimer = 0;
  pendingSpecial = false;
  specialTimer = 18000 + Math.random() * 7000;
  resetDog();
}

// ---- disegno ----
function drawBackground() {
  Foligno.draw(ctx, W, H, GROUND_Y, worldX);
}

// disegni SVG provvisori: groundY = y dei piedi nel sistema del viewBox (già traslato), w = larghezza viewBox
const DOG_IMG = {
  onni:   { src: 'art/onni.svg',   w: 330, h: 227, groundY: 212, splitY: 150, bodyCx: 150 },
  daphne: { src: 'art/daphne.svg', w: 330, h: 255, groundY: 240, splitY: 165, bodyCx: 155 }
};
for (const k in DOG_IMG) { const im = new Image(); im.src = DOG_IMG[k].src; DOG_IMG[k].img = im; }
const DOG_SCALE = 0.33;

// cani ricavati dalle foto vere (scontornati + filtro), animati a ritagli; style = 'light' (realistico) o 'toon'
const PHOTO_RIGS = {
  onni: {
    scale: 0.32,
    rig: {
      width: 360, height: 228, groundY: 222, centerX: 180,
      legs: [
        { name: 'hind', x: 49, y: 115, w: 72, h: 113, pivot: [84, 135], cut: 141 },
        { name: 'front', x: 224, y: 124, w: 58, h: 104, pivot: [251, 143], cut: 150 }
      ]
    }
  },
  // Daphne: da Foto/Nuove/IMG_7398, vita assottigliata e zampette ridisegnate (un po' più alta di Onni, ma più snella)
  daphne: {
    scale: 0.4,
    rig: {
      width: 360, height: 201, groundY: 191, centerX: 180,
      legs: [
        { name: 'hind', x: 49, y: 77, w: 84, h: 124, pivot: [98, 97], cut: 103, stretch: 1 },
        { name: 'front', x: 234, y: 96, w: 43, h: 105, pivot: [254, 114], cut: 120, stretch: 1 }
      ]
    }
  }
};
for (const k in PHOTO_RIGS) for (const style of ['light', 'toon']) DogRig.load(`${k}_${style}`, `art/foto/${k}_${style}`, PHOTO_RIGS[k].rig);
let dogStyle = 'light';
try { dogStyle = localStorage.getItem('onnidaphne_style') || 'light'; } catch (e) {}

function drawDog() {
  const d = DOG_IMG[selectedDog];
  const s = DOG_SCALE;
  const feetX = dog.x + dog.w / 2, feetY = dog.y + dog.h;
  const invincible = gameTime < invincibleUntil;
  const crouch = dog.crouching && dog.onGround;

  ctx.save();
  ctx.translate(feetX, feetY);
  if (invincible) {
    ctx.save();
    ctx.globalAlpha = 0.3 + 0.3 * (0.5 + 0.5 * Math.sin(gameTime * 0.012));
    ctx.fillStyle = '#ffd60a';
    ctx.beginPath(); ctx.ellipse(10, -32, 62, 42, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  const photo = PHOTO_RIGS[selectedDog];
  if (photo) {
    const pose = crouch ? { crouch: true } : !dog.onGround ? { air: dog.vy < 0 ? -1 : 1 } : { run: state === 'playing' ? dog.legPhase : null };
    if (DogRig.draw(ctx, `${selectedDog}_${dogStyle}`, pose, photo.scale)) { ctx.restore(); return; }
  }
  const ready = d.img.complete && d.img.naturalWidth;
  if (crouch && ready) {
    // abbassata: zampe piegate (solo la parte delle zampe si accorcia), corpo intero e testa un po' in giù
    const kx = d.img.naturalWidth / d.w, ky = d.img.naturalHeight / d.h;
    const legsH = (d.groundY - d.splitY) * s * 0.3;
    ctx.drawImage(d.img, 0, d.splitY * ky, d.w * kx, (d.groundY - d.splitY) * ky,
      -d.bodyCx * s, -legsH, d.w * s, legsH);
    ctx.translate(0, -legsH + 2);
    ctx.rotate(0.12);
    ctx.scale(0.88, 0.88);
    ctx.drawImage(d.img, 0, 0, d.w * kx, d.splitY * ky, -d.bodyCx * s, -d.splitY * s, d.w * s, d.splitY * s);
    ctx.restore();
    return;
  }
  if (!dog.onGround) {
    ctx.rotate(dog.vy < 0 ? -0.15 : 0.1);
  } else {
    ctx.translate(0, -Math.abs(Math.sin(dog.legPhase)) * 3);
    ctx.rotate(Math.sin(dog.legPhase) * 0.04);
  }
  if (ready) {
    ctx.drawImage(d.img, -d.bodyCx * s, -d.groundY * s, d.w * s, d.h * s);
  }
  ctx.restore();
}

function drawObstacles() {
  for (const o of obstacles) {
    const v = (o.h * 7.31) % 1; // variante stabile per ogni ostacolo
    ctx.save();
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#3a2c25'; ctx.lineWidth = 2;
    if (o.kind === 'ground') {
      if (v < 0.62) drawGeraniumPot(o); else drawBollard(o);
    } else if (o.y < 0) {
      drawQuintanaBanner(o, v);
    } else {
      drawHangingSign(o);
    }
    ctx.restore();
  }
}

// vaso di terracotta con i gerani
function drawGeraniumPot(o) {
  const potTop = o.y + o.h * 0.38;
  ctx.fillStyle = '#c56a3c';
  ctx.beginPath();
  ctx.moveTo(o.x - 3, potTop); ctx.lineTo(o.x + o.w + 3, potTop);
  ctx.lineTo(o.x + o.w - 2, o.y + o.h); ctx.lineTo(o.x + 2, o.y + o.h); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#a9542d'; ctx.fillRect(o.x - 4, potTop, o.w + 8, 5); ctx.strokeRect(o.x - 4, potTop, o.w + 8, 5);
  ctx.fillStyle = '#4f7d3a';
  for (const [dx, dy, r] of [[0.2, 0.75, 7], [0.5, 0.55, 8], [0.8, 0.75, 7], [0.35, 0.3, 6], [0.68, 0.32, 6]]) {
    ctx.beginPath(); ctx.arc(o.x + o.w * dx, o.y + (potTop - o.y) * dy, r, 0, Math.PI * 2); ctx.fill();
  }
  for (const [dx, dy] of [[0.15, 0.45], [0.45, 0.15], [0.75, 0.35], [0.55, 0.62], [0.28, 0.75], [0.88, 0.6]]) {
    ctx.fillStyle = '#d8344a'; ctx.beginPath(); ctx.arc(o.x + o.w * dx, o.y + (potTop - o.y) * dy, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f37b8c'; ctx.beginPath(); ctx.arc(o.x + o.w * dx - 1, o.y + (potTop - o.y) * dy - 1, 1.3, 0, Math.PI * 2); ctx.fill();
  }
}

// paracarro di pietra
function drawBollard(o) {
  const r = o.w / 2 + 2, cx = o.x + o.w / 2;
  ctx.fillStyle = '#d6c9b1';
  ctx.beginPath();
  ctx.moveTo(o.x - 2, o.y + o.h); ctx.lineTo(o.x - 2, o.y + r); ctx.arc(cx, o.y + r, r, Math.PI, 0); ctx.lineTo(o.x + o.w + 2, o.y + o.h); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(o.x + 3, o.y + r, 4, o.h - r - 6);
  ctx.fillStyle = '#b9a98c'; ctx.fillRect(o.x - 4, o.y + o.h - 7, o.w + 8, 7); ctx.strokeRect(o.x - 4, o.y + o.h - 7, o.w + 8, 7);
  ctx.fillStyle = 'rgba(90,70,50,0.25)';
  for (const [dx, dy] of [[0.6, 0.45], [0.3, 0.7], [0.7, 0.8]]) ctx.fillRect(o.x + o.w * dx, o.y + o.h * dy, 4, 2);
}

// stendardo della Quintana che scende dall'alto: si passa solo abbassandosi
function drawQuintanaBanner(o, v) {
  const rione = Foligno.RIONI[Math.floor(v * Foligno.RIONI.length)], a = rione.a, b = rione.b;
  const bottom = o.y + o.h, tip = 10;
  ctx.fillStyle = a; ctx.fillRect(o.x, o.y, o.w / 2, o.h - tip);
  ctx.fillStyle = b; ctx.fillRect(o.x + o.w / 2, o.y, o.w / 2, o.h - tip);
  ctx.fillStyle = a;
  ctx.beginPath(); ctx.moveTo(o.x, bottom - tip); ctx.lineTo(o.x + o.w / 2, bottom); ctx.lineTo(o.x + o.w / 2, bottom - tip); ctx.closePath(); ctx.fill();
  ctx.fillStyle = b;
  ctx.beginPath(); ctx.moveTo(o.x + o.w / 2, bottom - tip); ctx.lineTo(o.x + o.w / 2, bottom); ctx.lineTo(o.x + o.w, bottom - tip); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x, bottom - tip); ctx.lineTo(o.x + o.w / 2, bottom); ctx.lineTo(o.x + o.w, bottom - tip); ctx.lineTo(o.x + o.w, o.y); ctx.stroke();
  // stemma ufficiale del rione e frange dorate
  const shade = ctx.createLinearGradient(o.x, 0, o.x + o.w, 0);
  shade.addColorStop(0, 'rgba(255,255,255,0.12)'); shade.addColorStop(1, 'rgba(0,0,0,0.2)');
  ctx.fillStyle = shade; ctx.fillRect(o.x, o.y, o.w, o.h - tip);
  Foligno.emblem(ctx, rione, o.x + o.w / 2, bottom - 48, 38);
  ctx.strokeStyle = '#e0b83a'; ctx.lineWidth = 1.5;
  for (let fx = o.x + 3; fx < o.x + o.w; fx += 4) { const fy = bottom - tip + (fx - o.x < o.w / 2 ? (fx - o.x) / (o.w / 2) * tip : (o.x + o.w - fx) / (o.w / 2) * tip); ctx.beginPath(); ctx.moveTo(fx, fy - 2); ctx.lineTo(fx, fy + 3); ctx.stroke(); }
}

// insegna appesa alle corde: si salta oppure ci si passa sotto
function drawHangingSign(o) {
  ctx.strokeStyle = '#6b5a48'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(o.x + 6, o.y); ctx.lineTo(o.x + 2, 0); ctx.moveTo(o.x + o.w - 6, o.y); ctx.lineTo(o.x + o.w - 2, 0); ctx.stroke();
  ctx.strokeStyle = '#3a2c25'; ctx.lineWidth = 2;
  ctx.fillStyle = '#7a4a2a'; ctx.fillRect(o.x - 4, o.y, o.w + 8, o.h); ctx.strokeRect(o.x - 4, o.y, o.w + 8, o.h);
  ctx.fillStyle = '#efe2c4'; ctx.fillRect(o.x, o.y + 4, o.w, o.h - 8); ctx.strokeRect(o.x, o.y + 4, o.w, o.h - 8);
  ctx.fillStyle = '#7a2a2a'; ctx.font = 'bold 6.5px Georgia, serif'; ctx.textAlign = 'center';
  ctx.fillText('GIOSTRA', o.x + o.w / 2, o.y + 18); ctx.fillText('DELLA', o.x + o.w / 2, o.y + 28); ctx.fillText('QUINTANA', o.x + o.w / 2, o.y + 38);
}

function drawTreats() {
  treats.forEach(t => {
    if (t.taken) return;
    ctx.save();
    ctx.translate(t.x, t.y);
    if (t.special) {
      // alone luminoso: segnala che dà invincibilità
      ctx.globalAlpha = 0.35 + 0.2 * Math.sin(gameTime * 0.01);
      ctx.fillStyle = '#ffd60a';
      ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      drawToy(t.toy);
    } else {
      drawBone();
    }
    ctx.restore();
  });
}

function drawBone() {
  ctx.fillStyle = '#fff6e0';
  ctx.strokeStyle = '#5b4a33';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.rect(-8, -3.5, 16, 7);
  for (const [x, y] of [[-9, -4], [-9, 4], [9, -4], [9, 4]]) {
    ctx.moveTo(x + 4.5, y);
    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
  }
  ctx.stroke();
  ctx.fill();
}

function drawToy(toy) {
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#222';
  if (toy === 'pallina') {
    ctx.fillStyle = '#c6e83a';
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-12, 0, 10, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(12, 0, 10, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  } else if (toy === 'orsetto') {
    ctx.fillStyle = '#b5824f';
    for (const [x, y, r] of [[-8, -10, 5], [8, -10, 5], [0, 0, 12]]) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = '#e8c9a0';
    ctx.beginPath(); ctx.ellipse(0, 4, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222';
    for (const [x, y, r] of [[-4, -3, 1.6], [4, -3, 1.6], [0, 2.5, 1.8]]) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  } else if (toy === 'calzino') {
    ctx.fillStyle = '#e85d75';
    ctx.beginPath();
    ctx.moveTo(-6, -14); ctx.lineTo(5, -14); ctx.lineTo(5, 4);
    ctx.quadraticCurveTo(14, 4, 14, 10); ctx.quadraticCurveTo(14, 15, 6, 15);
    ctx.lineTo(-2, 15); ctx.quadraticCurveTo(-6, 15, -6, 10); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-5, -13, 9, 3); ctx.fillRect(-5, -7, 9, 3);
  } else {
    // ciabatta
    ctx.fillStyle = '#4aa3df';
    ctx.beginPath(); ctx.ellipse(0, 3, 15, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f2f2f2';
    ctx.beginPath(); ctx.ellipse(4, 0, 8, 6, 0, Math.PI, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

// ---- loop ----
let lastTime = null;
function loop(t) {
  if (lastTime === null) lastTime = t;
  const dt = Math.min(t - lastTime, 40);
  lastTime = t;

  if (state === 'menu') worldX += dt * 0.05;
  drawBackground();

  if (state === 'playing') {
    update(dt);
  }

  drawObstacles();
  drawTreats();
  drawDog();

  requestAnimationFrame(loop);
}

function update(dt) {
  gameTime += dt;
  worldX += speed * dt;
  const ramp = Math.min(gameTime / RAMP_TIME, 1);
  speed = SCROLL_BASE + ramp * SCROLL_MAX_ADD;

  const invincible = gameTime < invincibleUntil;
  document.getElementById('invincibleBadge').textContent = invincible
    ? '✨ Invincibile! ' + Math.ceil((invincibleUntil - gameTime) / 1000) + 's'
    : '';

  // altezza cane in base a crouch
  const targetH = dog.crouching && dog.onGround ? CROUCH_H : standH();
  if (dog.h !== targetH) {
    const bottom = dog.y + dog.h;
    dog.h = targetH;
    dog.y = bottom - dog.h;
  }

  // fisica salto
  if (!dog.onGround) {
    dog.vy += GRAVITY * dt;
    dog.y += dog.vy * dt;
    if (dog.y >= GROUND_Y - dog.h) {
      dog.y = GROUND_Y - dog.h;
      dog.vy = 0;
      dog.onGround = true;
    }
  } else {
    dog.legPhase += dt * 0.02;
  }

  // spawn ostacoli (sempre più frequenti col tempo)
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnObstacle();
    // distanza minima in px = lunghezza di un salto + margine, così ogni ostacolo è sempre superabile
    const extraPx = Math.random() * 180 + (1 - ramp) * 150;
    // 25%: spazio più lungo con premietti in alto, raggiungibili solo con un salto ben cronometrato
    highTreats = Math.random() < 0.25;
    const gapMs = AIR_TIME * 1.1 + extraPx / speed + (highTreats ? AIR_TIME * 1.2 : 0);
    spawnTimer = gapMs;
    freeTreatTimer = gapMs * 0.5;
  }
  if (freeTreatTimer > 0) {
    freeTreatTimer -= dt;
    if (freeTreatTimer <= 0 && (highTreats || Math.random() < 0.7)) spawnFreeTreats(highTreats);
  }
  specialTimer -= dt;
  if (specialTimer <= 0) {
    pendingSpecial = true;
    specialTimer = 22000 + Math.random() * 10000;
  }

  obstacles.forEach(o => o.x -= speed * dt);
  obstacles = obstacles.filter(o => o.x + o.w > -10);

  treats.forEach(t => t.x -= speed * dt);
  treats = treats.filter(t => t.x > -20 && !t.taken);

  // collisioni ostacoli
  const dogBox = { x: dog.x + 10, y: dog.y + 6, w: dog.w - 20, h: dog.h - 8 };
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    if (rectsOverlap(dogBox, o)) {
      if (invincible) {
        obstacles.splice(i, 1);
        score += 15;
      } else {
        gameOver();
        return;
      }
    }
  }

  // raccolta premietti
  for (const t of treats) {
    const dx = (dog.x + dog.w / 2) - t.x;
    const dy = (dog.y + dog.h / 2) - t.y;
    if (Math.sqrt(dx * dx + dy * dy) < 34) {
      t.taken = true;
      if (t.special) {
        invincibleUntil = gameTime + 10000;
        score += 50;
      } else {
        score += 10;
      }
    }
  }

  score += dt * 0.012;
  document.getElementById('score').textContent = '🦴 ' + Math.floor(score);
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function jump() {
  if (state !== 'playing') return;
  if (dog.onGround && !dog.crouching) {
    dog.vy = JUMP_V;
    dog.onGround = false;
  }
}

function setCrouch(v) {
  if (state !== 'playing') return;
  dog.crouching = v;
}

function gameOver() {
  state = 'gameover';
  const finalScore = Math.floor(score);
  if (finalScore > best) {
    best = finalScore;
    try { localStorage.setItem('onnidaphne_best', String(best)); } catch (e) {}
  }
  document.getElementById('best').textContent = 'Record: ' + best;
  document.getElementById('invincibleBadge').textContent = '';
  document.getElementById('title').textContent = 'Ops! 🐾';
  document.getElementById('subtitle').textContent =
    'Punteggio: ' + finalScore + '  —  Record: ' + best;
  document.getElementById('startBtn').textContent = 'Riprova';
  document.getElementById('overlay').classList.remove('hidden');
}

function startGame() {
  resetGame();
  state = 'playing';
  document.getElementById('overlay').classList.add('hidden');
}

// ---- input ----
document.addEventListener('selectstart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });

const jumpBtn = document.getElementById('jumpBtn');
const duckBtn = document.getElementById('duckBtn');
jumpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); jump(); });
duckBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); setCrouch(true); });
duckBtn.addEventListener('pointerup', () => setCrouch(false));
duckBtn.addEventListener('pointerleave', () => setCrouch(false));
duckBtn.addEventListener('pointercancel', () => setCrouch(false));

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') jump();
  if (e.code === 'ArrowDown') setCrouch(true);
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowDown') setCrouch(false);
});

document.querySelectorAll('#dogSelect .dogBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#dogSelect .dogBtn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedDog = btn.dataset.dog;
    resetDog();
  });
});

document.querySelectorAll('#styleSelect .dogBtn').forEach(btn => {
  btn.classList.toggle('selected', btn.dataset.style === dogStyle);
  btn.addEventListener('click', () => {
    document.querySelectorAll('#styleSelect .dogBtn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    dogStyle = btn.dataset.style;
    try { localStorage.setItem('onnidaphne_style', dogStyle); } catch (e) {}
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);

resetDog();
requestAnimationFrame(loop);

// gioco disponibile offline: attivo solo nella versione pubblicata (tools/build.js mette true)
const OFFLINE_ENABLED = true;
if (OFFLINE_ENABLED && 'serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
