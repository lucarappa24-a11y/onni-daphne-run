<svg xmlns="http://www.w3.org/2000/svg" width="330" height="255" viewBox="0 -40 330 255">
  <defs>
    <path id="body" d="M 86 80 C 88 66, 110 62, 132 66 C 158 70, 182 68, 200 70 C 222 74, 232 94, 228 112 C 224 126, 208 132, 192 128 C 172 122, 154 110, 136 108 C 116 112, 96 116, 88 106 C 80 98, 80 88, 86 80 Z"/>
    <path id="neck" d="M 196 76 C 204 48, 222 26, 244 24 L 262 66 C 252 92, 234 108, 214 112 C 202 104, 196 92, 196 76 Z"/>
    <path id="legFN" d="M 200 104 C 199 138, 200 172, 202 190 C 201 201, 223 203, 222 194 C 219 176, 216 140, 218 106 Z"/>
    <path id="legFF" d="M 182 104 C 181 138, 182 172, 184 190 C 183 201, 205 203, 204 194 C 201 176, 198 140, 200 106 Z"/>
    <path id="legHN" d="M 98 86 C 84 106, 84 134, 94 154 C 98 166, 94 184, 96 196 C 100 204, 116 202, 114 194 C 110 184, 112 170, 112 158 C 116 138, 122 116, 122 96 Z"/>
    <path id="legHF" d="M 118 88 C 104 108, 104 136, 114 156 C 118 168, 114 184, 116 196 C 120 204, 136 202, 134 194 C 130 184, 132 170, 132 160 C 136 140, 142 118, 142 98 Z"/>
    <path id="tail" d="M 90 78 C 68 82, 52 100, 44 124 C 41 134, 47 137, 51 131 C 58 110, 72 96, 94 88 Z"/>
    <path id="head" d="M 226 62 C 224 40, 244 26, 263 29 C 277 31, 286 41, 291 52 C 301 58, 313 66, 318 76 C 322 86, 315 96, 301 98 C 285 101, 268 106, 252 108 C 237 108, 226 94, 226 62 Z"/>
    <path id="ear" d="M 238 44 C 225 44, 218 58, 218 80 C 218 102, 221 117, 229 121 C 237 123, 242 112, 242 97 C 242 82, 244 62, 238 44 Z"/>
    <clipPath id="clipHN"><use href="#legHN"/></clipPath>
    <clipPath id="clipHF"><use href="#legHF"/></clipPath>
    <clipPath id="clipTail"><use href="#tail"/></clipPath>
    <clipPath id="clipTorso"><use href="#body"/><use href="#neck"/></clipPath>
    <clipPath id="clipHead"><use href="#head"/></clipPath>
  </defs>

  <!-- zampe lontane: anteriore bianca in ombra, posteriore con coscia nera -->
  <g stroke="#161616" stroke-width="3.5" stroke-linejoin="round">
    <use href="#legHF" fill="#e3e1e8"/>
    <use href="#legFF" fill="#e3e1e8"/>
  </g>
  <rect x="90" y="60" width="70" height="94" fill="#161616" clip-path="url(#clipHF)"/>
  <g fill="#161616"><circle cx="124" cy="176" r="1.8"/><circle cx="191" cy="160" r="1.8"/><circle cx="194" cy="178" r="1.6"/><circle cx="189" cy="140" r="1.5"/></g>
  <g fill="none" stroke="#161616" stroke-width="2" stroke-linecap="round">
    <path d="M 120 199 L 121 194 M 127 199 L 128 194"/><path d="M 191 199 L 192 194 M 198 199 L 199 194"/>
  </g>

  <!-- coda nera con la punta bianca -->
  <use href="#tail" fill="#161616" stroke="#161616" stroke-width="3.5" stroke-linejoin="round"/>
  <rect x="30" y="108" width="28" height="40" fill="#fbfbf8" clip-path="url(#clipTail)"/>
  <use href="#tail" fill="none" stroke="#161616" stroke-width="3" stroke-linejoin="round"/>

  <!-- contorni uniti, poi riempimenti -->
  <g stroke="#161616" stroke-width="7" stroke-linejoin="round" fill="#161616">
    <use href="#body"/><use href="#neck"/><use href="#legFN"/><use href="#legHN"/>
  </g>
  <g>
    <use href="#body" fill="#161616"/><use href="#neck" fill="#161616"/>
    <use href="#legFN" fill="#fbfbf8"/><use href="#legHN" fill="#fbfbf8"/>
  </g>
  <!-- coscia posteriore nera fino al garretto -->
  <rect x="70" y="60" width="70" height="90" fill="#161616" clip-path="url(#clipHN)"/>
  <use href="#legHN" fill="none" stroke="#4a4a4a" stroke-width="1.6" clip-path="url(#clipHN)"/>
  <path d="M 100 112 C 98 128, 100 140, 106 150" fill="none" stroke="#4a4a4a" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 200 104 L 218 106 L 217 122 C 210 124, 204 122, 200 118 Z" fill="#161616"/>

  <!-- pettorale e gola bianchi, pancia bianca -->
  <g clip-path="url(#clipTorso)">
    <path d="M 238 20 C 252 40, 266 60, 260 84 C 252 110, 236 130, 214 134 C 200 132, 194 120, 196 110 C 206 98, 214 84, 222 64 C 228 48, 232 32, 238 20 Z" fill="#fbfbf8"/>
    <path d="M 140 116 C 160 112, 180 118, 200 126 L 200 140 L 140 140 Z" fill="#fbfbf8"/>
  </g>

  <!-- puntini neri sulle parti bianche -->
  <g fill="#161616">
    <circle cx="232" cy="70" r="1.8"/><circle cx="240" cy="82" r="2"/><circle cx="226" cy="90" r="1.6"/><circle cx="246" cy="64" r="1.5"/>
    <circle cx="220" cy="104" r="1.9"/><circle cx="234" cy="100" r="1.6"/><circle cx="214" cy="118" r="1.7"/><circle cx="226" cy="114" r="1.4"/>
    <circle cx="250" cy="74" r="1.3"/><circle cx="238" cy="92" r="1.2"/>
    <circle cx="208" cy="136" r="1.8"/><circle cx="213" cy="150" r="1.6"/><circle cx="207" cy="164" r="1.9"/><circle cx="214" cy="178" r="1.5"/><circle cx="210" cy="186" r="1.3"/>
    <circle cx="101" cy="168" r="1.7"/><circle cx="106" cy="182" r="1.5"/><circle cx="103" cy="158" r="1.4"/>
  </g>
  <g fill="none" stroke="#161616" stroke-width="2.5" stroke-linecap="round">
    <path d="M 100 199 L 101 194 M 107 199 L 108 194"/><path d="M 208 199 L 209 194 M 215 199 L 216 194"/>
  </g>

  <!-- collare rosa -->
  <g transform="translate(2,-28)">
    <path d="M 232 102 C 240 110, 252 112, 262 108" fill="none" stroke="#161616" stroke-width="10" stroke-linecap="round"/>
    <path d="M 232 102 C 240 110, 252 112, 262 108" fill="none" stroke="#f7a8c2" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- testa -->
  <g transform="translate(2,-28)">
    <use href="#head" fill="#161616" stroke="#161616" stroke-width="3.5" stroke-linejoin="round"/>
    <g clip-path="url(#clipHead)">
      <!-- striscia bianca: dalla cima della testa, tra gli occhi, fino a tutto il muso -->
      <path d="M 254 28 C 263 24, 274 27, 279 32 C 281 40, 282 46, 284 52 C 292 58, 308 64, 318 74 L 324 90 C 318 100, 300 104, 284 104 C 280 98, 279 90, 279 84 C 278 72, 276 60, 274 50 C 270 42, 262 36, 254 28 Z" fill="#fbfbf8"/>
    </g>
    <!-- macchia nera in cima alla testa, dentro la striscia bianca -->
    <ellipse cx="268" cy="35" rx="4.2" ry="3.6" fill="#161616" transform="rotate(-20 268 35)"/>
    <!-- occhi marroni dolci, un filo di bianco sotto (sguardo all'insù) -->
    <path d="M 257 57 C 260 50, 270 50, 273 56 C 272 63, 261 65, 257 57 Z" fill="#fbfbf8"/>
    <path d="M 257.5 56 C 260 50.5, 270 50.5, 272.5 55 C 271 60, 261 61, 257.5 56 Z" fill="#6a3418"/>
    <circle cx="265" cy="55" r="3.4" fill="#120a05"/>
    <circle cx="266.6" cy="52.8" r="1.6" fill="#ffffff"/>
    <path d="M 286 52 C 288 46, 296 46, 298 51 C 297 57, 289 58, 286 52 Z" fill="#fbfbf8"/>
    <path d="M 286.3 51.2 C 288 46.3, 296 46.3, 297.7 50.5 C 296.5 54.5, 289 55, 286.3 51.2 Z" fill="#6a3418"/>
    <circle cx="292" cy="50.8" r="2.8" fill="#120a05"/>
    <circle cx="293.2" cy="49.2" r="1.2" fill="#ffffff"/>
    <!-- naso, bocca, puntini sul muso -->
    <path d="M 307 68 C 318 66, 324 75, 321 84 C 318 90, 308 90, 305 84 C 302 78, 302 72, 307 68 Z" fill="#161616"/>
    <ellipse cx="311" cy="71" rx="3" ry="1.5" fill="#4a4a4a"/>
    <path d="M 305 95 C 295 100, 282 101, 272 99" fill="none" stroke="#161616" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="#161616"><circle cx="296" cy="84" r="1.4"/><circle cx="290" cy="78" r="1.2"/><circle cx="300" cy="78" r="1.1"/><circle cx="288" cy="88" r="1.3"/><circle cx="294" cy="92" r="1.1"/></g>
    <!-- orecchio nero lungo -->
    <use href="#ear" fill="#161616" stroke="#161616" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 241 60 C 243 78, 242 98, 238 114" fill="none" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
