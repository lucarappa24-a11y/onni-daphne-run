    <path d="M 259 57 C 262 50, 272 50, 275 56 C 274 63, 263 65, 259 57 Z" fill="#5a3218" stroke="#161616" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="267.5" cy="57" r="3.6" fill="#120a05"/>
    <circle cx="269" cy="54.5" r="1.6" fill="#ffffff"/>
    <path d="M 284 52 C 286 46, 295 46, 297 51 C 296 57, 287 58, 284 52 Z" fill="#5a3218" stroke="#161616" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="290.5" cy="52" r="3" fill="#120a05"/>
    <circle cx="291.8" cy="50.3" r="1.3" fill="#ffffff"/>
