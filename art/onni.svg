    <path d="M 307 68 C 318 66, 324 75, 321 84 C 318 90, 308 90, 305 84 C 302 78, 302 72, 307 68 Z" fill="#161616"/>
    <ellipse cx="311" cy="71" rx="3" ry="1.5" fill="#4a4a4a"/>
    <path d="M 305 95 C 295 100, 282 101, 270 99 C 266 99, 263 101, 262 104" fill="none" stroke="#161616" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="#161616"><circle cx="294" cy="87" r="1.2"/><circle cx="288" cy="83" r="1.1"/><circle cx="299" cy="81" r="1"/><circle cx="284" cy="88" r="1"/></g>

    <!-- orecchio lungo nero con screziature bianche -->
    <use href="#ear" fill="#161616" stroke="#161616" stroke-width="5" stroke-linejoin="round"/>
    <use href="#ear" fill="none" stroke="#fbfbf8" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 240 62 C 242 78, 241 96, 237 110" fill="none" stroke="#fbfbf8" stroke-width="1.6" stroke-linecap="round"/>
    <g fill="#fbfbf8"><circle cx="231" cy="64" r="1.6"/><circle cx="225" cy="76" r="1.4"/><circle cx="234" cy="86" r="1.7"/><circle cx="223" cy="95" r="1.3"/><circle cx="231" cy="102" r="1.6"/><circle cx="226" cy="109" r="1.2"/><circle cx="235" cy="74" r="1.1"/></g>
  </g>
</svg>
